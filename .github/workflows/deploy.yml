name: Deploy to GitHub Pages & Sync Sessions

on:
  push:
    branches:
      - main
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC to sync newly announced or rescheduled sessions
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync session catalog from live AWS API
        run: |
          python3 scripts/sync_sessions.py

      - name: Commit fresh dataset if changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync re:Invent 2026 session catalog [skip ci]" && git push)

      - name: Build static web app
        env:
          VITE_BASE_PATH: '/reinvent-2026-finder/'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
